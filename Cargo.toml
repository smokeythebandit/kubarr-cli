[package]
name = "kubarr-cli"
version = "0.2.3"
edition = "2021"
rust-version = "1.88"
authors = ["Kubarr Team"]
description = "Standalone command-line tools for installing and developing Kubarr"
publish = false

[[bin]]
name = "kubarr"
path = "src/main.rs"

[dependencies]
bcrypt = "0.19"
axum = "0.8"
dialoguer = "0.12"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
tower = "0.5"
